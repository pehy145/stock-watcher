name: Stock check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay runs by a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "check = zkontrolovat sklad, test = poslat testovací zprávu"
        type: choice
        options: [check, test]
        default: check
  push:
    branches: [main]
    paths: [items.json]      # run right after you add/edit items

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check stock
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py ${{ inputs.mode == 'test' && '--test-message' || '' }}

      - name: Save state
        if: inputs.mode != 'test'
        run: |
          git config user.name "stock-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update stock state"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
